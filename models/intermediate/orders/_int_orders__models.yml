version: 2

models:
  - name: int_order_items_aggregated
    description: >
      An order-level summary aggregated from individual order items (stg_thelook_ecommerce__order_items).
      Each row represents one order, consolidating item counts, total sale amounts,
      return metrics, and status information. This model serves as a reliable
      sub-ledger for revenue recognition and refund liability reporting.

    config:
      tags: ['financial', 'audit_ready']

    columns:
      - name: order_id
        description: "Primary Key. Unique identifier for each order, aggregated from line-item detail."
        tests:
          - unique
          - not_null

      - name: user_id
        description: "Foreign Key to the customer who placed the order."
        tests:
          - not_null
          - relationships:
              to: ref('stg_thelook_ecommerce__users')
              field: user_id

      - name: order_item_status_list
        description: >
          A comma-separated, alphabetically ordered string of all distinct item statuses
          within the order (e.g., 'complete,returned,shipped'). Useful for quickly
          identifying mixed-status orders.
        tests:
          - not_null

      - name: subledger_item_count
        description: "The total number of line items (units) within the order."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
                description: "Every order must contain at least one item."

      - name: total_order_amount
        description: "The gross total sale amount for the order, rounded to 2 decimal places."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
                description: "Total order amount cannot be negative."

      - name: first_item_created_at
        description: "The earliest created_at timestamp among all line items in the order."
        tests:
          - not_null

      - name: returned_item_count
        description: "The count of individual items with a status of 'returned' within the order."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
                description: "Returned item count cannot be negative."
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= subledger_item_count"
                description: "Returned items cannot exceed total items in the order."

      - name: refund_amount
        description: >
          The total sale price of all returned items, representing the refund liability
          for the order. Rounded to 2 decimal places.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
                description: "Refund amount cannot be negative."
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= total_order_amount"
                description: "Refund amount cannot exceed the gross order total."

      - name: last_refund_at
        description: "The latest returned_at timestamp among all returned items in the order. Null if no items were returned."

  - name: int_orders_joined
    description: >
      FULL JOIN of the master order ledger (stg_thelook_ecommerce__orders) and the
      subledger summary (int_order_items_aggregated). Exposes both master and subledger
      columns side-by-side so downstream mart models can apply audit logic without
      repeating the join. Used by order_reconciliation and revenue.
    columns:
      - name: order_id
        description: "Unified order ID. COALESCE of subledger and master order_id."
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Unified user ID. COALESCE of subledger and master user_id."
      - name: master_order_id
        description: "order_id from the master ledger (stg_orders). Null indicates an orphan subledger record."
      - name: master_order_status
        description: "Order status from the master ledger."
      - name: master_item_count
        description: "Item count from the master ledger (number_of_items)."
      - name: created_at
        description: "Order creation timestamp from the master ledger."
      - name: shipped_at
        description: "Shipment timestamp from the master ledger. Null if not yet shipped."
      - name: returned_at
        description: "Return timestamp from the master ledger."
      - name: delivered_at
        description: "Delivery timestamp from the master ledger."
      - name: subledger_order_id
        description: "order_id from the subledger (int_order_items_aggregated). Null indicates a missing subledger."
      - name: subledger_order_status
        description: "Aggregated item status string from the subledger."
      - name: subledger_item_count
        description: "Item count from the subledger."
      - name: total_order_amount
        description: "Gross order total from the subledger."
      - name: first_item_created_at
        description: "Earliest item created_at in the order. Used for incremental filtering in downstream marts."
      - name: returned_item_count
        description: "Count of returned items in the order."
      - name: refund_amount
        description: "Total refund amount for the order."
      - name: last_refund_at
        description: "Latest return timestamp in the order. Used for incremental filtering in downstream marts."
