# yaml-language-server: $schema=../../../.vscode/empty-schema.json
metrics:

  # -------------------------------------------------------
  # Revenue Metrics
  # -------------------------------------------------------

  - name: total_recognized_revenue
    label: "Total Recognized Revenue"
    description: "Accrual-basis revenue from shipped orders only."
    type: simple
    type_params:
      measure: recognized_revenue

  - name: total_gross_revenue
    label: "Total Gross Revenue"
    description: "Total order value regardless of shipment status."
    type: simple
    type_params:
      measure: gross_revenue

  - name: order_count
    label: "Order Count"
    description: "Total number of orders."
    type: simple
    type_params:
      measure: order_count

  - name: revenue_recognition_rate
    label: "Revenue Recognition Rate"
    description: >
      Ratio of recognized (shipped) revenue to gross revenue.
      Low values indicate a high backlog of unshipped orders.
    type: ratio
    type_params:
      numerator:
        name: total_recognized_revenue
      denominator:
        name: total_gross_revenue

  # -------------------------------------------------------
  # Refund Metrics
  # -------------------------------------------------------

  - name: total_refund_amount
    label: "Total Refund Amount"
    description: "Total refunded amount across all orders."
    type: simple
    type_params:
      measure: refund_amount

  - name: total_net_revenue
    label: "Total Net Revenue"
    description: "Net revenue after all refunds."
    type: simple
    type_params:
      measure: net_revenue

  - name: refund_base_gross_revenue
    label: "Gross Revenue (Refund Base)"
    description: >-
      Gross revenue from the refund reconciliation model, used as refund rate
      denominator.
    type: simple
    type_params:
      measure: refund_gross_revenue

  - name: refund_rate
    label: "Refund Rate"
    description: >
      Refund amount as a proportion of gross revenue.
      Key audit metric for revenue integrity.
    type: ratio
    type_params:
      numerator:
        name: total_refund_amount
      denominator:
        name: refund_base_gross_revenue

  # -------------------------------------------------------
  # Order Item Metrics
  # -------------------------------------------------------

  - name: total_item_gross_revenue
    label: "Total Item Gross Revenue"
    description: "Total sale price across all order items regardless of status."
    type: simple
    type_params:
      measure: item_gross_revenue

  - name: total_recognized_item_revenue
    label: "Total Recognized Item Revenue"
    description: "Accrual-basis revenue at item level: counted only when shipped_at is populated."
    type: simple
    type_params:
      measure: recognized_item_revenue

  - name: item_count
    label: "Item Count"
    description: "Total number of order items."
    type: simple
    type_params:
      measure: item_count

  - name: item_recognition_rate
    label: "Item Recognition Rate"
    description: >
      Ratio of recognized (shipped) item revenue to gross item revenue.
      Breakdowns by order_item_status show which status buckets drive unrecognized revenue.
    type: ratio
    type_params:
      numerator:
        name: total_recognized_item_revenue
      denominator:
        name: total_item_gross_revenue

  # -------------------------------------------------------
  # Cumulative Metrics
  # -------------------------------------------------------

  - name: cumulative_recognized_revenue
    label: "Cumulative Recognized Revenue"
    description: >
      All-time cumulative recognized revenue. Filter by year to get YTD figures
      for period-end audit verification.
    type: cumulative
    type_params:
      measure: recognized_revenue

  - name: cumulative_gross_revenue
    label: "Cumulative Gross Revenue"
    description: >
      All-time cumulative gross revenue. Compare with cumulative_recognized_revenue
      to track unrecognized backlog growth over time.
    type: cumulative
    type_params:
      measure: gross_revenue

  - name: cumulative_refund_amount
    label: "Cumulative Refund Amount"
    description: >
      All-time cumulative refund amount. Use with year filter for YTD refund
      exposure at any period-end.
    type: cumulative
    type_params:
      measure: refund_amount

  - name: cumulative_order_count
    label: "Cumulative Order Count"
    description: "All-time cumulative number of orders."
    type: cumulative
    type_params:
      measure: order_count

  # -------------------------------------------------------
  # MoM Growth Metrics
  # -------------------------------------------------------

  - name: revenue_growth_mom
    label: "Revenue Growth % M/M"
    description: >
      Month-over-month percentage growth in recognized (shipped) revenue.
      Negative values flag revenue contraction for audit review.
    type: derived
    type_params:
      expr: (current_revenue - revenue_prev_month) * 100 / revenue_prev_month
      metrics:
        - name: total_recognized_revenue
          alias: current_revenue
        - name: total_recognized_revenue
          alias: revenue_prev_month
          offset_window: 1 month

  - name: gross_revenue_growth_mom
    label: "Gross Revenue Growth % M/M"
    description: >
      Month-over-month percentage growth in gross revenue (pre-recognition).
      Compare with revenue_growth_mom to detect recognition lag widening.
    type: derived
    type_params:
      expr: (current_gross - prev_gross) * 100 / prev_gross
      metrics:
        - name: total_gross_revenue
          alias: current_gross
        - name: total_gross_revenue
          alias: prev_gross
          offset_window: 1 month

  - name: refund_rate_change_mom
    label: "Refund Rate Change M/M (pp)"
    description: >
      Month-over-month change in refund rate in percentage points.
      A rising value is a key audit signal for return anomalies.
    type: derived
    type_params:
      expr: current_refund_rate - prev_refund_rate
      metrics:
        - name: refund_rate
          alias: current_refund_rate
        - name: refund_rate
          alias: prev_refund_rate
          offset_window: 1 month

  - name: item_revenue_growth_mom
    label: "Item Revenue Growth % M/M"
    description: >
      Month-over-month percentage growth in recognized item-level revenue.
      Can be broken down by order_item_status for partial refund trend analysis.
    type: derived
    type_params:
      expr: (current_item_revenue - prev_item_revenue) * 100 / prev_item_revenue
      metrics:
        - name: total_recognized_item_revenue
          alias: current_item_revenue
        - name: total_recognized_item_revenue
          alias: prev_item_revenue
          offset_window: 1 month

  # -------------------------------------------------------
  # Inventory Metrics
  # -------------------------------------------------------

  - name: total_inventory_value
    label: "Total Inventory Value"
    description: "Gross inventory value at cost as of fiscal year end."
    type: simple
    type_params:
      measure: ending_inventory_value

  - name: total_net_realizable_value
    label: "Total Net Realizable Value"
    description: "Inventory value after LCM adjustment."
    type: simple
    type_params:
      measure: ending_nrv

  - name: total_lcm_allowance
    label: "Total LCM Allowance"
    description: "Total LCM write-down allowance (balance sheet contra-asset)."
    type: simple
    type_params:
      measure: lcm_allowance

  - name: total_cogs
    label: "Total COGS"
    description: "Total Cost of Goods Sold for the period."
    type: simple
    type_params:
      measure: period_cogs

  - name: total_period_revenue
    label: "Total Period Revenue"
    description: "Total inventory-derived sales revenue for the period."
    type: simple
    type_params:
      measure: period_revenue

  - name: inventory_gross_profit
    label: "Inventory Gross Profit"
    description: "Gross profit from inventory sales (Revenue - COGS)."
    type: derived
    type_params:
      expr: total_period_revenue - total_cogs
      metrics:
        - name: total_period_revenue
        - name: total_cogs
