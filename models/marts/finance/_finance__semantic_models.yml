# yaml-language-server: $schema=../../../.vscode/empty-schema.json
semantic_models:

  - name: revenue
    config:
      docs:
        node_color: "#F1948A"
    description: >-
      Order-level revenue recognition model. Grain: one row per order.
    model: ref('revenue')
    defaults:
      agg_time_dimension: created_at

    entities:
      - name: order
        type: primary
        expr: order_id
      - name: user
        type: foreign
        expr: user_id

    dimensions:
      - name: created_at
        type: time
        type_params:
          time_granularity: day
      - name: shipped_at
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
      - name: data_integrity_status
        type: categorical
      - name: cutoff_status
        type: categorical
      - name: is_high_value_order
        description: "Flags orders with gross_revenue > $200 (approx. top 15% by order value)."
        type: categorical
        expr: "case when gross_revenue > 200 then true else false end"

    measures:
      - name: recognized_revenue
        description: >-
          Accrual-basis revenue: counted only when shipped_at is populated.
        agg: sum
        expr: recognized_revenue
      - name: gross_revenue
        description: "Total order value regardless of shipment status."
        agg: sum
        expr: gross_revenue
      - name: order_count
        description: "Total number of orders."
        agg: count_distinct
        expr: order_id
      - name: total_item_count
        description: "Total number of line items across all orders."
        agg: sum
        expr: total_item_count

  - name: refund_reconciliation
    config:
      docs:
        node_color: "#F1948A"
    description: >-
      Order-level refund reconciliation model. Grain: one row per order.
    model: ref('refund_reconciliation')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order
        type: primary
        expr: order_id
      - name: user
        type: foreign
        expr: user_id

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: refund_type
        type: categorical

    measures:
      - name: refund_gross_revenue
        description: "Gross order revenue before refunds."
        agg: sum
        expr: gross_revenue
      - name: refund_amount
        description: "Total refund amount per order."
        agg: sum
        expr: refund_amount
      - name: net_revenue
        description: "Revenue after refunds (gross - refund)."
        agg: sum
        expr: net_revenue
      - name: total_returned_items
        description: "Total number of returned items across refunded orders."
        agg: sum
        expr: total_returned_items
      - name: refunded_order_count
        description: "Count of orders with at least one refund."
        agg: count_distinct
        expr: order_id

  - name: inventory_fiscal_report
    config:
      docs:
        node_color: "#F1948A"
    description: >
      Annual inventory valuation model. Grain: one row per (product_id, fiscal_year).
      fiscal_year (integer) is converted to fiscal year-end date (Dec 31) for time aggregation.
    model: ref('inventory_fiscal_report')
    defaults:
      agg_time_dimension: fiscal_year_end_date

    entities:
      - name: product
        type: primary
        expr: product_id
      - name: product_category
        type: foreign
        expr: product_category

    dimensions:
      - name: fiscal_year_end_date
        type: time
        # Mirrors macros/fiscal_year_end.sql — can't call the macro directly here
        # (semantic model expr isn't rendered in a Jinja context with project macros
        # in scope), so the LEAST(..., current_date) cap is duplicated inline.
        expr: "LEAST(CAST(CAST(fiscal_year AS VARCHAR) || '-12-31' AS DATE), current_date)"
        type_params:
          time_granularity: year
      - name: fiscal_year
        type: categorical
        expr: CAST(fiscal_year AS VARCHAR)
      - name: product_name
        type: categorical
      - name: product_brand
        type: categorical
      - name: inventory_risk_rating
        type: categorical

    measures:
      - name: period_revenue
        description: "Total sales revenue for the fiscal year."
        agg: sum
        expr: period_revenue
      - name: period_cogs
        description: "Total Cost of Goods Sold for the fiscal year."
        agg: sum
        expr: period_cogs_amount
      - name: period_units_sold
        description: "Total number of units sold during the fiscal year."
        agg: sum
        expr: period_units_sold
      - name: ending_inventory_value
        description: "Gross inventory value at cost as of fiscal year end."
        agg: sum
        expr: ending_gross_inv_value
      - name: ending_nrv
        description: >-
          Net Realizable Value after LCM adjustment at fiscal year end.
        agg: sum
        expr: ending_net_realizable_value
      - name: lcm_allowance
        description: "Total LCM write-down allowance (contra-asset)."
        agg: sum
        expr: ending_allowance_lcm

  - name: order_item_revenue
    config:
      docs:
        node_color: "#F1948A"
    description: >-
      Order item-level revenue model. Grain: one row per order item.
      Enables item status breakdown (complete / returned / shipped / etc.)
      that is not possible at order grain.
    model: ref('order_item_revenue')
    defaults:
      agg_time_dimension: created_at

    entities:
      - name: order_item
        type: primary
        expr: order_item_id
      - name: order
        type: foreign
        expr: order_id
      - name: user
        type: foreign
        expr: user_id
      - name: product
        type: foreign
        expr: product_id

    dimensions:
      - name: created_at
        type: time
        type_params:
          time_granularity: day
      - name: shipped_at
        type: time
        type_params:
          time_granularity: day
      - name: order_item_status
        type: categorical

    measures:
      - name: item_gross_revenue
        description: "Total sale price across all items regardless of status."
        agg: sum
        expr: sale_price
      - name: recognized_item_revenue
        description: "Accrual-basis revenue at item level: counted only when shipped_at is populated."
        agg: sum
        expr: recognized_item_revenue
      - name: item_count
        description: "Total number of order items."
        agg: count_distinct
        expr: order_item_id

  - name: audit_materiality
    config:
      docs:
        node_color: "#F1948A"
    description: >-
      CPA-defined audit materiality thresholds by product category.
      Grain: one row per product_category. Dimensional model only — no measures.
    model: ref('audit_materiality_thresholds')

    entities:
      - name: product_category
        type: primary
        expr: product_category

    dimensions:
      - name: risk_tier
        type: categorical
      - name: materiality_threshold
        type: categorical
      - name: rationale
        type: categorical
