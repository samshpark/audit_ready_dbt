version: 2

models:
  - name: fct_order_recon
    description: >
      Master-to-subledger reconciliation at order level.
      Detects orphaned subledger records, missing subledgers,
      item count variances, and status mismatches between raw_orders and raw_order_items.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Customer identifier. Sourced from master (raw_orders)."
        tests:
          - not_null
      - name: order_at
        description: "Order creation timestamp from master table."
      - name: total_order_amount
        description: "Total order amount from subledger (sum of sale_price per order)."
      - name: master_item_count
        description: "Item count from master table (raw_orders.num_of_item)."
      - name: subledger_item_count
        description: "Item count from subledger (COUNT of raw_order_items per order)."
      - name: order_reconciliation
        tests:
          - accepted_values:
              arguments:
                values: [
                  'RECONCILIATION SUCCESSFUL', 
                  'ERR: ORPHAN SUB-LEDGER', 
                  'ERR: MISSING SUB-LEDGER'
                ]
      - name: order_item_count_recon
        description: "Identify if item count in master & sub-ledger agrees"
        tests:
          - accepted_values:
              arguments:
                values: ['INTEGRITY VERIFIED', 'VARIANCE DETECTED', 'N/A - PREVIOUS ERROR']
      
      - name: order_status_recon
        description: "Identify if order status in master & sub-ledger agrees"
        tests:
          - accepted_values:
              arguments:
                values: ['INTEGRITY VERIFIED', 'VARIANCE DETECTED', 'N/A - PREVIOUS ERROR']
        