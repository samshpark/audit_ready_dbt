version: 2

models:
  - name: fct_revenue
    description: "Orders and items joined to calculate recognized revenue and audit risks."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: created_at
        description: "Order creation timestamp (UTC). Used for cut-off period determination."
      - name: shipped_at
        description: "Shipment timestamp. Null indicates pending shipment. Drives revenue recognition."

      - name: recognized_revenue
        description: "Accrual-basis revenue: equals gross_revenue only when shipped_at is populated."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: gross_revenue
        description: "Total order value from the subledger regardless of shipment status."
      
      - name: user_id
        tests:
          - not_null

      - name: data_integrity_status
        description: "Checks if order exists in both master and sub-ledger."
        tests:
          - accepted_values:
              arguments:
                values: ['MATCHED', 'ERR: ORPHAN SUB-LEDGER', 'ERR: MISSING SUB-LEDGER']

      - name: cutoff_status
        description: "Identifies month-end shipping risks for revenue recognition."
        tests:
          - accepted_values:
              arguments:
                values: ['NORMAL', 'SHIPPING_PENDING', 'POTENTIAL CUT-OFF RISK']