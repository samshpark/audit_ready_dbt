version: 2

models:
  - name: stg_thelook_ecommerce__products
    description: "Cleaned and recast product catalog from raw_products."
    columns:
      - name: product_id
        description: "Primary key for products (cast to string)"
        tests:
          - unique
          - not_null
      - name: cost
        description: "Cost to acquire the product"
        tests:
          - not_null
      - name: category
        description: "Lowercased product category"
      - name: name
        description: "Product name"
      - name: brand
        description: "Brand name"
      - name: retail_price
        description: "Suggested retail price"
        tests:
          - not_null
      - name: department
        description: "Product department"
      - name: sku
        description: "Product SKU"
      - name: distribution_center_id
        description: "Foreign key to distribution centers (cast to string)"
