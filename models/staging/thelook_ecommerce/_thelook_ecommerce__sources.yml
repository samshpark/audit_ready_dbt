version: 2

sources:
  - name: thelook_ecommerce
    description: >-
      E-commerce dataset extracted from BigQuery and stored as local Parquet
      files.
    loader: python_script
    # meta: external_location allows DuckDB to map dbt source names
    # directly to the local file path. {name} maps to the table name below.
    
    tables:
      - name: raw_orders
        description: "Primary table for order headers and status."
        meta:
          external_location: "data/{name}.parquet"
        columns:
          - name: order_id
            description: "Primary key for orders"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "Foreign key to the user table"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook_ecommerce', 'raw_users')
                    field: id
          - name: status
            description: "Current State of order"
            tests:
              - accepted_values: 
                  arguments:
                    values: ['Processing', 'Shipped', 'Complete', 'Returned', 'Cancelled']
          - name: created_at
            description: "Order created at (timestamp)"
          - name: shipped_at
            description: "Order Shipped Date; Null if not shipped"
          - name: returned_at
            description: "Order Returned Date; Null if not returned"
          - name: delivered_at
            description: "Order Delivered Date; Null if not delivered"
          - name: num_of_item
            description: >-
              Number of items included in an order (renamed to number_of_items
              in staging)
      
      - name: raw_order_items
        description: >-
          Granular table containing individual line items per order.
        meta:
          external_location: "data/{name}.parquet"
        columns:
          - name: id
            description: "Primary key for order items"
            tests:
              - unique
              - not_null
          - name: order_id
            description: "Foreign key to the order table"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook_ecommerce', 'raw_orders')
                    field: order_id
          - name: user_id
            description: "Foreign key to the user table"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook_ecommerce', 'raw_users')
                    field: id
          - name: product_id
            description: "Foreign key to the product table"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook_ecommerce', 'raw_products')
                    field: id
          - name: inventory_item_id
            description: >-  # Not Included in the ingestion
              Foreign key to the inventory_item_id
          - name: sale_price
            description: "sale price of item"
            tests:
              - not_null
          - name: status
            description: "Current State of order"
            tests:
              - accepted_values: 
                  arguments:
                    values: ['Processing', 'Shipped', 'Complete', 'Returned', 'Cancelled']
          - name: created_at
            description: "Order created at (timestamp)"
      
      - name: raw_products
        description: "Product catalog including categories and retail prices."
        meta:
          external_location: "data/{name}.parquet"
        columns:
          - name: id
            description: "Primary key for products"
            tests:
              - unique
              - not_null
          - name: cost
            description: "The cost to acquire the product"
            tests:
              - not_null
          - name: category
            description: "Product category"
          - name: brand
            description: "Brand name of the product"
          - name: retail_price
            description: "The suggested retail price for the product"
            tests:
              - not_null
          - name: distribution_center_id
            description: >-  # Not Included in the ingestion
              Foreign key to the distribution centers table

      - name: raw_users
        description: >-
          Customer profile data including sign-up dates and demographics.
        meta:
          external_location: "data/{name}.parquet"
        columns:
          - name: id
            description: user_id
            tests:
              - unique
              - not_null
          - name: email
            description: "user email address"

      - name: raw_inventory_items
        description: "Include each inventory item and description."
        meta:
          external_location: "data/{name}.parquet"
        columns:
          - name: id
            description: "Primary key for inventory items"
            tests:
              - unique
              - not_null
          - name: product_id
            description: "Foreign key to the product table"
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook_ecommerce', 'raw_products')
                    field: id
          - name: created_at
            description: "Order created at (timestamp)"
          - name: cost
            description: "Historical acquisition cost per unit."
            tests:
              - dbt_utils.expression_is_true:
                  arguments:
                    expression: ">= 0"
          - name: product_distribution_center_id
            description: >-  # Not Included in the ingestion
              Foreign key to the distribution centers table
