version: 2

models:
  - name: stg_thelook_ecommerce__users
    description: "Cleaned and recast user profiles from raw_users."
    columns:
      - name: user_id
        description: "Primary key for users (cast to string)"
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Lowercased first name"
      - name: last_name
        description: "Lowercased last name"
      - name: email
        description: "Lowercased email address"
        tests:
          - not_null
      - name: age
        description: "User age"
      - name: gender
        description: "Lowercased gender"
      - name: state
        description: "Lowercased state"
      - name: street_address
        description: "Lowercased street address"
      - name: postal_code
        description: "Postal code"
      - name: city
        description: "Lowercased city"
      - name: country
        description: "Lowercased country"
      - name: latitude
        description: "Geographic latitude"
      - name: longitude
        description: "Geographic longitude"
      - name: traffic_source
        description: "Lowercased acquisition traffic source"
      - name: created_at
        description: "Account creation timestamp"
      - name: user_geom
        description: "Geographic geometry point"
