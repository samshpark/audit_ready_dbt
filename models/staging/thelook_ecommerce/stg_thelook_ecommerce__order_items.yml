version: 2

models:
  - name: stg_thelook_ecommerce__order_items
    description: "Cleaned and recast individual order line items from raw_order_items."
    columns:
      - name: order_item_id
        description: "Primary key for order items (cast to string)"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to stg_thelook_ecommerce__orders"
        tests:
          - not_null
      - name: user_id
        description: "Foreign key to stg_thelook_ecommerce__users"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to stg_thelook_ecommerce__products"
        tests:
          - not_null
      - name: inventory_item_id
        description: "Foreign key to stg_thelook_ecommerce__inventory_items"
      - name: order_item_status
        description: "Lowercased order item status"
        tests:
          - accepted_values:
              arguments:
                values: ['processing', 'shipped', 'complete', 'returned', 'cancelled']
      - name: created_at
        description: "Order item creation timestamp (UTC)"
      - name: shipped_at
        description: "Shipment timestamp (UTC)"
      - name: delivered_at
        description: "Delivery timestamp (UTC)"
      - name: returned_at
        description: "Return timestamp (UTC)"
      - name: sale_price
        description: "Sale price of the item"
        tests:
          - not_null
