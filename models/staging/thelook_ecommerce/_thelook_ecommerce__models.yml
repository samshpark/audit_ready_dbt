version: 2

models:
  - name: stg_thelook_ecommerce__inventory_items
    description: "Cleaned and recast inventory items from raw_inventory_items."
    columns:
      - name: inventory_item_id
        description: "Primary key for inventory items (cast to string)"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Foreign key to stg_thelook_ecommerce__products"
        tests:
          - not_null
      - name: created_at
        description: "Inventory item creation timestamp (UTC)"
      - name: sold_at
        description: "Timestamp when the item was sold (UTC)"
      - name: cost
        description: "Historical acquisition cost per unit"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: product_category
        description: "Lowercased product category"
      - name: product_name
        description: "Product name"
      - name: product_brand
        description: "Product brand"
      - name: product_retail_price
        description: "Suggested retail price"
        tests:
          - not_null
      - name: product_department
        description: "Lowercased product department"
      - name: product_sku
        description: "Product SKU"
      - name: product_distribution_center_id
        description: "Foreign key to distribution centers"

  - name: stg_thelook_ecommerce__order_items
    description: >-
      Cleaned and recast individual order line items from raw_order_items.
    columns:
      - name: order_item_id
        description: "Primary key for order items (cast to string)"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to stg_thelook_ecommerce__orders"
        tests:
          - not_null
      - name: user_id
        description: "Foreign key to stg_thelook_ecommerce__users"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to stg_thelook_ecommerce__products"
        tests:
          - not_null
      - name: inventory_item_id
        description: "Foreign key to stg_thelook_ecommerce__inventory_items"
      - name: order_item_status
        description: "Lowercased order item status"
        tests:
          - accepted_values:
              arguments:
                values: ['processing', 'shipped', 'complete', 'returned', 'cancelled']
      - name: created_at
        description: "Order item creation timestamp (UTC)"
      - name: shipped_at
        description: "Shipment timestamp (UTC)"
      - name: delivered_at
        description: "Delivery timestamp (UTC)"
      - name: returned_at
        description: "Return timestamp (UTC)"
      - name: sale_price
        description: "Sale price of the item"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

  - name: stg_thelook_ecommerce__orders
    description: "Cleaned and recast order headers from raw_orders."
    columns:
      - name: order_id
        description: "Primary key for orders (cast to string)"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Foreign key to stg_thelook_ecommerce__users"
        tests:
          - not_null
      - name: order_status
        description: "Lowercased order status"
        tests:
          - accepted_values:
              arguments:
                values: ['processing', 'shipped', 'complete', 'returned', 'cancelled']
      - name: user_gender
        description: "Lowercased gender"
      - name: created_at
        description: "Order creation timestamp (UTC)"
      - name: returned_at
        description: "Return timestamp (UTC)"
      - name: shipped_at
        description: "Shipment timestamp (UTC)"
      - name: delivered_at
        description: "Delivery timestamp (UTC)"
      - name: number_of_items
        description: "Number of items in the order"
        tests:
          - not_null

  - name: stg_thelook_ecommerce__products
    description: "Cleaned and recast product catalog from raw_products."
    columns:
      - name: product_id
        description: "Primary key for products (cast to string)"
        tests:
          - unique
          - not_null
      - name: cost
        description: "Cost to acquire the product"
        tests:
          - not_null
      - name: category
        description: "Lowercased product category"
      - name: name
        description: "Product name"
      - name: brand
        description: "Brand name"
      - name: retail_price
        description: "Suggested retail price"
        tests:
          - not_null
      - name: department
        description: "Product department"
      - name: sku
        description: "Product SKU"
      - name: distribution_center_id
        description: "Foreign key to distribution centers (cast to string)"

  - name: stg_thelook_ecommerce__users
    description: "Cleaned and recast user profiles from raw_users."
    columns:
      - name: user_id
        description: "Primary key for users (cast to string)"
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Lowercased first name"
      - name: last_name
        description: "Lowercased last name"
      - name: email
        description: "Lowercased email address"
        tests:
          - not_null
      - name: age
        description: "User age"
      - name: gender
        description: "Lowercased gender"
      - name: state
        description: "Lowercased state"
      - name: street_address
        description: "Lowercased street address"
      - name: postal_code
        description: "Postal code"
      - name: city
        description: "Lowercased city"
      - name: country
        description: "Lowercased country"
      - name: latitude
        description: "Geographic latitude"
      - name: longitude
        description: "Geographic longitude"
      - name: traffic_source
        description: "Lowercased acquisition traffic source"
      - name: created_at
        description: "Account creation timestamp"
      - name: user_geom
        description: "Geographic geometry point"
