version: 2

sources:
  - name: incremental
    description: >
      Daily synthetic orders generated by the Airflow pipeline (scripts/generate_daily_incremental.py).
      Simulates ongoing production data — new orders, shipments, and returns appended each day.
      Uses negative IDs to avoid collision with the BigQuery-sourced raw data.
      Stored as separate parquet files (incr_*.parquet) to keep the BigQuery source layer immutable.
    loader: airflow_pipeline

    tables:
      - name: incr_order_items
        description: >-
          Daily synthetic order line items with mixed statuses including partial
          refund scenarios.
        meta:
          external_location: "data/{name}.parquet"
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: incr_orders
        description: >-
          Daily synthetic order headers matching the line items in
          incr_order_items.
        meta:
          external_location: "data/{name}.parquet"
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: incr_inventory_items
        description: >-
          Daily synthetic inventory inbound records paired with
          incr_order_items.
        meta:
          external_location: "data/{name}.parquet"
        # No freshness check: created_at here is inbound date, backdated up to
        # 60 days before the linked order (see generate_daily_incremental.py) —
        # it reflects a business event, not load time, so it would always
        # read as "stale" and can't signal whether today's run happened.
