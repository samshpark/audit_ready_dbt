version: 2

macros:
  - name: fiscal_year_end
    description: >
      Returns the fiscal year-end date (December 31st) as a DATE type for a given year column,
      capped at current_date for the year still in progress so in-flight years are evaluated
      as of today rather than a not-yet-elapsed December 31st.
      Used for period-end inventory valuation and point-in-time SCD joins in inventory_fiscal_report.
    arguments:
      - name: year_col
        type: integer or column reference
        description: >
          The fiscal year value or column expression (e.g., 'y.fiscal_year').
          Rendered directly into SQL as: LEAST(CAST(<year_col> || '-12-31' AS DATE), current_date).

  - name: datediff_days
    description: >
      Calculates the number of days between two date columns via dbt's cross-database
      dbt.datediff() macro, so the same call compiles correctly on DuckDB, BigQuery, and Snowflake.
      Both inputs are cast to DATE before differencing to handle timestamp inputs safely.
      Used in int_inventory_items_joined for aging duration and velocity bucket calculations,
      and in inventory_fiscal_report for avg_days_on_hand_at_year_end.
    arguments:
      - name: start_col
        type: column reference
        description: The earlier date column (inbound date). Cast to DATE internally.
      - name: end_col
        type: column reference
        description: The later date column (outbound date or current date). Cast to DATE internally.

  - name: within_incremental_lookback
    description: >
      Returns a boolean expression testing whether a timestamp column falls within the
      incremental lookback window (var("incremental_lookback_days")). Written as
      `column + N days >= current_timestamp` rather than `current_timestamp - interval 'N days'`
      because BigQuery rejects quoted interval literals and negative intervals in DATETIME_ADD;
      the result is cast back to TIMESTAMP so the comparison type-checks on every adapter.
      Used to build the is_incremental() filter in order_reconciliation, revenue,
      refund_reconciliation, and order_item_revenue.
    arguments:
      - name: column_name
        type: column reference
        description: The timestamp column to test against the lookback window (e.g., 'created_at').

  - name: string_agg_distinct
    description: >
      Concatenates a column's distinct values in order. DuckDB and BigQuery both support
      string_agg(distinct col order by col), but Snowflake has no equivalent syntax -- it
      requires listagg(distinct col, sep) within group (order by col) instead, and Athena
      (Trino) has neither -- it uses array_join(array_sort(array_distinct(array_agg(col))), sep).
      Dispatches on target.type to render the correct form for each adapter.
      Used in int_order_items_aggregated to build order_item_status_list.
    arguments:
      - name: column_name
        type: column reference
        description: The column whose distinct values are concatenated (e.g., 'order_item_status').

  - name: duckdb__type_float
    description: >
      DuckDB implementation of dbt.type_float(). The default renders `float`, which DuckDB
      treats as 32-bit REAL and which silently loses cents on currency columns; this returns
      `double` so DuckDB matches the 64-bit float every other target uses. Found by the
      cross_warehouse_parity DAG (COGS differed by 0.59 across 547 rounding-boundary items).

  - name: duckdb__alter_column_type
    description: >
      DuckDB implementation of dbt's alter_column_type(), used when an incremental model with
      on_schema_change='sync_all_columns' sees a column type change. dbt's default
      (add / copy / drop / rename) followed by the MERGE in the same transaction fails to
      commit on DuckDB; a single ALTER COLUMN ... TYPE does not. Found by Slim CI when the
      duckdb__type_float fix changed incremental mart columns from FLOAT to DOUBLE.

  - name: set_utc_session_timezone
    description: >
      on-run-start hook that pins DuckDB's session time zone to UTC. Without it, staging's
      cast of TIMESTAMPTZ source columns to TIMESTAMP uses the host's local zone, shifting
      posting dates and month-end cut-off classification. Renders nothing on other adapters.
