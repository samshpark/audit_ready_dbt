version: 2

seeds:
  - name: audit_materiality_thresholds
    description: >
      Audit materiality thresholds by product category, defined from a CPA perspective.
      Each category is assigned a risk tier (High / Medium / Low) and a corresponding
      materiality threshold (USD) representing the minimum variance amount that warrants
      auditor follow-up. Used as a lookup table in inventory_fiscal_report to enrich
      audit output with category-level risk metadata.
    columns:
      - name: product_category
        description: "Product category name. Primary key — matches product_category in inventory_fiscal_report."
        tests:
          - unique
          - not_null
      - name: risk_tier
        description: "Audit risk classification: High / Medium / Low."
        tests:
          - not_null
          - accepted_values:
              values: ['High', 'Medium', 'Low']
      - name: materiality_threshold
        description: >
          Minimum USD variance that requires auditor investigation for this category.
          High = $10,000 | Medium = $5,000 | Low = $2,500.
        tests:
          - not_null
          - accepted_values:
              values: [10000, 5000, 2500]
              quote: false
      - name: rationale
        description: "Plain-language justification for the assigned risk tier."
        tests:
          - not_null


  - name: chart_of_accounts
    description: >
      General-ledger accounts used by journal_entries, with account type and normal
      balance so postings can be reviewed against expected sign conventions.
    columns:
      - name: account_code
        description: "GL account number. Primary key."
        tests:
          - unique
          - not_null
      - name: account_name
        tests:
          - not_null
      - name: account_type
        tests:
          - accepted_values:
              arguments:
                values: ['Asset', 'Liability', 'Equity', 'Revenue', 'Contra-Revenue', 'Expense']
      - name: normal_balance
        tests:
          - accepted_values:
              arguments:
                values: ['Debit', 'Credit']

  - name: journal_entry_rules
    description: >
      Posting rules: the debit and credit account for each entry type. Kept as a seed so
      accounting policy (e.g. account mapping) changes are reviewed as data, not SQL.
    columns:
      - name: entry_type
        description: "REV / RET / COGS. Primary key."
        tests:
          - unique
          - not_null
      - name: debit_account
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('chart_of_accounts')
                field: account_code
      - name: credit_account
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('chart_of_accounts')
                field: account_code
      - name: description
        tests:
          - not_null
