version: 2

seeds:
  - name: audit_materiality_thresholds
    description: >
      Audit materiality thresholds by product category, defined from a CPA perspective.
      Each category is assigned a risk tier (High / Medium / Low) and a corresponding
      materiality threshold (USD) representing the minimum variance amount that warrants
      auditor follow-up. Used as a lookup table in inventory_fiscal_report to enrich
      audit output with category-level risk metadata.
    columns:
      - name: product_category
        description: "Product category name. Primary key — matches product_category in inventory_fiscal_report."
        tests:
          - unique
          - not_null
      - name: risk_tier
        description: "Audit risk classification: High / Medium / Low."
        tests:
          - not_null
          - accepted_values:
              values: ['High', 'Medium', 'Low']
      - name: materiality_threshold
        description: >
          Minimum USD variance that requires auditor investigation for this category.
          High = $10,000 | Medium = $5,000 | Low = $2,500.
        tests:
          - not_null
          - accepted_values:
              values: [10000, 5000, 2500]
      - name: rationale
        description: "Plain-language justification for the assigned risk tier."
        tests:
          - not_null

  - name: data_test_order_items
    description: >
      Synthetic order items generated by scripts/create_sample_order_items.py for
      development-time unit testing of refund reconciliation logic. Contains 5,000 rows
      with negative order IDs to avoid collision with production data, fixed to 2026-03
      for deterministic test results. Isolated to the testing layer — does not flow
      into production intermediate models or marts.
    columns:
      - name: id
        description: "Synthetic item ID (negative integer)."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Synthetic order ID (negative integer, groups 2 items per order)."
        tests:
          - not_null
